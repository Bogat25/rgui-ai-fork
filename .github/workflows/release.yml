name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # No spaces: R's makefiles do not quote paths.
  BUILD_ROOT: C:\rgui-build
  RTOOLS_DIR: C:\rtools45-rgui
  RTOOLS_FILE: rtools45-6768-6492.exe
  RTOOLS_SHA256: 614c7378150a012e70b16edcfe5236dcead47f491f1f54203ea8d451c7743a75

jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 240
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Work out the version
        id: version
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if ($env:REF_TYPE -eq 'tag') {
            if ($env:REF_NAME -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?)$') {
              throw "Tag '$($env:REF_NAME)' is not like v0.1.1 or v0.2.0-rc1"
            }
            $v = $Matches[1]
          } else {
            $v = "0.0.0-dev.$($env:RUN_NUMBER)"
          }
          $pre = if ($v.Contains('-')) { 'true' } else { 'false' }
          "version=$v"       >> $env:GITHUB_OUTPUT
          "prerelease=$pre"  >> $env:GITHUB_OUTPUT
          Write-Host "version $v (prerelease: $pre)"

      - name: Test release infrastructure
        shell: pwsh
        run: |
          python -m unittest discover -s release -p 'test_*.py' -v
          if ($LASTEXITCODE -ne 0) { throw 'Release publisher regressions failed.' }
          .\release\test-offline.ps1

      - name: Cache downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ${{ env.BUILD_ROOT }}\cache
            C:\rgui-dl
          key: rgui-downloads-${{ env.RTOOLS_FILE }}-${{ hashFiles('rgui.ps1', 'release/assets.json') }}
          restore-keys: rgui-downloads-${{ env.RTOOLS_FILE }}-

      - name: Install Rtools45 (pinned, checksum verified)
        shell: pwsh
        run: |
          $exe = "C:\rgui-dl\$env:RTOOLS_FILE"
          New-Item -ItemType Directory -Force -Path C:\rgui-dl | Out-Null
          if (-not (Test-Path $exe)) {
            curl.exe --fail --location --retry 3 --silent --show-error -o $exe `
              "https://cran.r-project.org/bin/windows/Rtools/rtools45/files/$env:RTOOLS_FILE"
          }
          $got = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLowerInvariant()
          if ($got -ne $env:RTOOLS_SHA256) { Remove-Item $exe; throw "Rtools installer checksum mismatch: $got" }
          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList `
               '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', "/DIR=$env:RTOOLS_DIR"
          if ($p.ExitCode -ne 0) { throw "Rtools installer exited with $($p.ExitCode)" }
          & "$env:RTOOLS_DIR\x86_64-w64-mingw32.static.posix\bin\gcc.exe" --version | Select-Object -First 1
          Get-PSDrive C | ForEach-Object { 'C: {0:N0} GB free' -f ($_.Free / 1GB) }

      - name: Fetch Tcl/Tk, llama.cpp and Inno Setup (checksum verified)
        run: .\rgui.cmd fetch -BuildRoot $env:BUILD_ROOT -Rtools $env:RTOOLS_DIR
        shell: pwsh

      - name: Build R, base and recommended packages
        run: .\rgui.cmd full -BuildRoot $env:BUILD_ROOT -Rtools $env:RTOOLS_DIR
        shell: pwsh

      - name: Test (compile checks, unit and protocol tests, downloader)
        run: .\rgui.cmd test -BuildRoot $env:BUILD_ROOT -Rtools $env:RTOOLS_DIR
        shell: pwsh

      - name: Build the installer
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .\rgui.cmd installer -Offline -Version $env:VERSION -BuildRoot $env:BUILD_ROOT -Rtools $env:RTOOLS_DIR
        shell: pwsh

      - name: Test the installer (install, start, upgrade, uninstall)
        run: .\rgui.cmd test -Installer -Offline -BuildRoot $env:BUILD_ROOT -Rtools $env:RTOOLS_DIR
        shell: pwsh

      - name: Upload the installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: installer
          path: |
            ${{ env.BUILD_ROOT }}\installer\RGui-AI-${{ steps.version.outputs.version }}-offline-setup.exe
            ${{ env.BUILD_ROOT }}\installer\RGui-AI-${{ steps.version.outputs.version }}-offline-setup.exe.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: logs
          path: ${{ env.BUILD_ROOT }}\logs
          if-no-files-found: ignore
          retention-days: 7


  release:
    needs: build
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: sourceforge
    concurrency:
      group: sourceforge-release
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      SOURCEFORGE_PROJECT: ${{ vars.SOURCEFORGE_PROJECT }}
      SOURCEFORGE_USERNAME: ${{ vars.SOURCEFORGE_USERNAME }}
      SOURCEFORGE_SSH_KEY: ${{ secrets.SOURCEFORGE_SSH_KEY }}
      SOURCEFORGE_API_KEY: ${{ secrets.SOURCEFORGE_API_KEY }}
    steps:
      - name: Check out the release publisher
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Download tested release files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: installer
          path: dist
      - name: Write release notes
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          python3 - "$VERSION" <<'PY'
          import hashlib, pathlib, sys
          version = sys.argv[1]
          file = pathlib.Path('dist/RGui-AI-' + version + '-offline-setup.exe')
          with file.open('rb') as stream:
              digest = hashlib.file_digest(stream, 'sha256').hexdigest()
          pathlib.Path('dist/release-notes.md').write_text(
              'RGui AI for Windows x64.\n\n'
              'The complete per-user installer includes the application, CPU runtime, '
              'Qwen3.5-4B model, and picture reader. No model download is required after installation.\n\n'
              'This build is unsigned.\n\nSHA-256: ' + digest + '\n', encoding='utf-8')
          PY
      - name: Publish the complete offline installer
        uses: ./.github/actions/sourceforge
        with:
          artifact: dist/RGui-AI-${{ needs.build.outputs.version }}-offline-setup.exe
          notes: dist/release-notes.md
          version: ${{ needs.build.outputs.version }}
      - name: Publish GitHub release notes and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease --latest=false); fi
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
            --title "RGui AI $VERSION" --notes-file dist/release-notes-sourceforge.md \
            "${flags[@]}" "dist/RGui-AI-$VERSION-offline-setup.exe.sha256"
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
