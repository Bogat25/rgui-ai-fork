# Configuration for the RGui AI assistant (Misc menu -> AI assistant).
# The system-wide copy is in R_HOME/etc/Rai.conf.
#
# Lines are  key = value.  Everything after a '#' is a comment.
# Relative paths are taken relative to R_HOME, so the whole tree can be
# moved between drive letters without editing anything.

## Turn the assistant off completely.  When this is 'no' the menu entry
## is not even created and no code in aichat.c ever runs.
  enabled = yes

## Accelerator letter for the menu entry (Ctrl+<letter>).  Avoid
## A B D E F H I K N P, which the console uses for line editing, and
## C V X L S W, which other RGui menus already take.
  hotkey = T

## ------------------------------------------------------------------
## The local model server
## ------------------------------------------------------------------

## llama.cpp's llama-server.exe.  The DLLs that come with it must sit in
## the same directory; it is started with that directory as its working
## directory, so PATH does not have to be touched.
  server_exe = ai/llama/llama-server.exe

## The GGUF model file.
  model = ai/models/Qwen3.5-4B-Q4_K_M.gguf

## Loopback address and port.  Nothing listens on an external interface.
  host = 127.0.0.1
  port = 8713

## Start the server when the panel is first opened, so that the first
## question does not have to wait for the model to load.
  autostart = yes

## Seconds to wait for the model to finish loading.  A 4B Q4_K_M model
## on an i5 with a spinning USB stick can take a couple of minutes the
## first time; afterwards Windows' file cache makes it much faster.
  startup_timeout = 240

## Seconds of silence from the server before a request is abandoned.
  request_timeout = 120

## Extra flags passed to llama-server verbatim.  Useful ones:
##   --mlock          keep the model in RAM (needs the privilege)
##   -fa              flash attention
##   --no-mmap        read the model into RAM instead of mapping it,
##                    which is often faster when it lives on a USB stick
  extra_args = --no-mmap

## ------------------------------------------------------------------
## Model behaviour
## ------------------------------------------------------------------

## Context window in tokens.  8192 fits the course material plus a long
## conversation in well under 4 GB with a 4B Q4_K_M model.
  ctx_size = 8192

## Maximum length of one answer, in tokens.
  n_predict = 1024

## CPU threads.  0 lets llama-server pick; on a 4-core i5 leave it at 0
## or set it to 4.  Setting it higher than the physical core count makes
## generation slower, not faster.
  threads = 0

## Layers to put on a GPU.  These machines have none, so 0.
  gpu_layers = 0

## Low temperature keeps code answers close to the course material.
  temperature = 0.3
  top_p = 0.9

## Let the model reason out loud before answering.  Qwen3-style models
## support this; it roughly triples the time per answer on a CPU, which
## is why it is off.
  thinking = no

## Remove any <think>...</think> block from the transcript even when the
## model emits one anyway.  Leave this on.
  strip_think = yes

## ------------------------------------------------------------------
## Course material
## ------------------------------------------------------------------

## The standing instructions sent with every question.  If the file is
## missing a built-in default is used.
  system_prompt_file = ai/system_prompt.txt

## Every .txt .md .R .Rmd .csv file in this directory is offered to the
## model as reference material.  When they do not all fit in the budget
## below, the ones sharing the most words with your question win.
  context_dir = ai/context

## Characters of course material per question.  Roughly 4 characters per
## token, so 12000 is about 3000 tokens out of the 8192 context.  Raise
## it if you have a lot of notes and a big ctx_size; lower it if answers
## become slow.
  context_max_chars = 12000

## How many earlier messages of the conversation to resend each time.
## Larger means better memory and slower answers.
  keep_history = 12
